services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_ticket}
      POSTGRES_USER: ${POSTGRES_USER:-event_ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-event_ticket}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-event_ticket}:${POSTGRES_PASSWORD:-event_ticket}@postgres:5432/${POSTGRES_DB:-event_ticket}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    command:
      ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && node dist/main.js"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
